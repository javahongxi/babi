server:
  port: 8902

spring:
  application:
    name: babi-spring

babi:
  agent:
    workspace: ~/babi-workspace
    enable-task-list: true
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    chat:
      model: qwen3.7-plus
      temperature: 0.7
      top-p: 0.9
      enable-search: false
    image:
      model: qwen-image-3.0-pro
      prompt-extend: true
