server:
  port: 8900

spring:
  application:
    name: babi-agent

babi:
  agent:
    workspace: ~/babi-workspace
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    chat:
      model: qwen3.8-max
      fallback-model: dashscope:deepseek-v4-flash  # format:: provider:model-name
      temperature: 0.7
      top-p: 0.9
      enable-search: false
