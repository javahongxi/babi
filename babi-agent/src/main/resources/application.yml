server:
  port: 8900

spring:
  application:
    name: babi-agent

babi:
  agent:
    workspace: ~/babi-workspace
    enable-task-list: true
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    chat:
      model: qwen3.7-plus
      # format: "provider:model-name" (e.g. dashscope:deepseek-v4-flash)
      # or DashScope qwen short form (e.g. qwen-plus)
      fallback-model: dashscope:deepseek-v4-flash
      temperature: 0.7
      top-p: 0.9
      enable-search: false
    image:
      model: qwen-image-3.0-pro
      prompt-extend: true
