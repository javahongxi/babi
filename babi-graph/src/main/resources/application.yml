server:
  port: 8901

spring:
  application:
    name: babi-graph
  profiles:
    active: dashscope

babi:
  agent:
    workspace: ~/babi-workspace


---
spring:
  config:
    activate:
      on-profile: dashscope
babi:
  open-ai:
    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}
      model-name: qwen-plus
      log-requests: false
      log-responses: false
      temperature: 0.7
      top-p: 0.9


---
spring:
  config:
    activate:
      on-profile: deepseek
babi:
  open-ai:
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      model-name: deepseek-v4-flash
      log-requests: false
      log-responses: false
      temperature: 0.7
      top-p: 0.9
