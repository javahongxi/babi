server:
  port: 8901

spring:
  application:
    name: babi-graph

babi:
  agent:
    workspace: ~/babi-workspace
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    chat:
      model: qwen3.8-max
      temperature: 0.7
      top-p: 0.9
      enable-search: false
    image:
      model: qwen-image-3.0-pro
      prompt-extend: true
